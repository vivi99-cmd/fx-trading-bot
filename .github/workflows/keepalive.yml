name: Keepalive

# GitHub disables scheduled workflows on a public repository after 60 days
# with no commit activity, and only tells you by email. This repo's last
# commit was 2026-07-14, which put the live trading cron on track to be
# switched off silently around 2026-09-12 while every dashboard still looked
# healthy. A weekly commit resets that clock.
#
# It writes a timestamp rather than an empty commit because GitHub counts
# repository activity, and an empty commit is the kind of thing that is easy
# to "clean up" later without realising what it was for.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, well clear of any session-open window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch heartbeat
        run: |
          mkdir -p .github
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/last-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-heartbeat
          git commit -m "Keepalive heartbeat [skip ci]"
          git pull --rebase --autostash
          git push
