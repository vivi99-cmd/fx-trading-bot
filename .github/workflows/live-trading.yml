name: Live FX Session Breakout Trading

on:
  schedule:
    # Each window is generous margin covering both EDT/EST versions of that
    # session's actual open hour -- the real gate is live_fx_runner.py
    # checking (a) the current ET hour against config.SESSIONS and (b)
    # OANDA's tradeable flag, so firing outside real hours or on a
    # weekend/holiday is a harmless no-op.
    - cron: "*/15 21-23 * * *"   # Sydney (17:00 ET open)
    - cron: "*/15 23,0,1 * * *"  # Tokyo (19:00 ET open, wraps past UTC midnight)
    - cron: "*/15 7-9 * * *"     # London (3:00 ET open)
    - cron: "*/15 12-14 * * *"  # New York (8:00 ET open)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live FX signal runner
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python broker/live_fx_runner.py --execute

      - name: Persist trading state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain broker/state/)" ]; then
            git add broker/state/
            git commit -m "Update trading state [skip ci]"
            # Another scheduled run may have pushed since checkout; rebase
            # rather than fail, since losing an acted-signal record would
            # allow a duplicate entry on the next run.
            git pull --rebase --autostash
            git push
          fi

      # A run that dies is otherwise invisible unless you happen to open the
      # Actions tab. One transient OANDA 401 already cost a New York session
      # this way, unnoticed for over a week. Reuses a single open issue so
      # repeated failures bump one thread instead of filing dozens.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label bot-failure --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Another failed run: $run_url"
          else
            gh label create bot-failure --color B60205 --description "Live trading run failed" 2>/dev/null || true
            gh issue create \
              --title "Live FX trading run failed" \
              --label bot-failure \
              --body "The scheduled live FX run failed: $run_url

          Trading is halted until this run succeeds again. Close this issue once resolved."
          fi
